<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Is cordx56 fine?</title>

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@cordx56" />
    <meta name="twitter:creator" content="@cordx56" />

    <meta property="og:title" content="Is cordx56 fine?" />
    <meta property="og:description" content="cordx56の健康状態がみられます。" />
    <meta property="og:url" content="https://isfine.cordx.cx/" />

    <style>
      :root {
        font-family: sans-serif;
        text-align: center;
        font-size: 2em;
      }
      h1 {
        font-weight: 300;
        font-size: 2em;
      }
    </style>
  </head>
  <body>
    <h1 id="heading">Is cordx56 fine?</h1>
    <p id="asleep"></p>
    <p id="heart"></p>
    <p id="location"></p>
    <p id="timeOffset"></p>
    <script>
      const now = new Date();
      fetch("/api/health")
        .then((resp) => resp.json())
        .then((data) => {
          const asleep = document.getElementById("asleep");
          const heart = document.getElementById("heart");
          const heartData = data.heart_rate;
          if (heartData && heartData.avg) {
            const d = new Date(heartData.date);
            const min = Math.floor((now.getTime() - d.getTime()) / (60 * 1000));
            const resting = data.resting_heart_rate;
            if (resting) {
              if (resting.qty + 10 < heartData.avg) {
                asleep.textContent = "起きています";
              } else if (resting.qty + 5 < heartData.avg) {
                asleep.textContent = "多分起きています";
              } else {
                asleep.textContent = "寝ています";
              }
            }
            heart.textContent =
              "直近の心拍数は" +
              Math.floor(heartData.avg).toString() +
              "bpm（" +
              min.toString() +
              "分前）";
          }
        });
      fetch("/api/location")
        .then((resp) => resp.json())
        .then((data) => {
          const loca = document.getElementById("location");
          loca.textContent = data.wide;

          const localOffset = new Date().getTimezoneOffset();
          const offset = data.dstOffset + data.rawOffset + localOffset;
          const offsetElem = document.getElementById("timeOffset");
          offsetElem.textContent = `あなたとの時差は${offset / 60}時間です`;
        });
    </script>
  </body>
</html>
