<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Is cordx56 fine?</title>

    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@cordx56">
    <meta name="twitter:creator" content="@cordx56">

    <meta property="og:title" content="Is cordx56 fine?">
    <meta property="og:description" content="cordx56の健康状態がみられます。">
    <meta property="og:url" content="https://isfine.cordx.cx/">
  </head>
  <body>
    <h1 id="heading">Is cordx56 fine?</h1>
    <p id="asleep"></p>
    <script>
      const now = new Date();
      fetch("/api/data")
        .then((resp) => resp.json())
        .then((data) => {
          const asleep = document.getElementById("asleep");
          const asleepData = data.asleep;
          if (asleepData.end) {
            const end = new Date(asleepData.end);
            if (now.getTime() - end.getTime() > 600 * 1000) {
              const start = new Date(asleepData.start);
              const dur = (end.getTime() - start.getTime()) / (3600 * 1000);
              asleep.textContent = "起きています; 前回の睡眠時間：" + dur.toString() + "時間";
              return;
            }
          }
          asleep.textContent = "寝ています";
        });
    </script>
  </body>
</html>
